<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - DormCare</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        width: 100%;
        max-width: 430px;
        padding: 20px;
      }

      .card {
        background: white;
        border-radius: 14px;
        padding: 35px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      .title {
        text-align: center;
        margin-bottom: 10px;
        color: #222;
      }

      .description {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d8dce5;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: #4f46e5;
      }

      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }

      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-bottom: 20px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
      }

      .error {
        background: #fee2e2;
        color: #b91c1c;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
      }

      .login-link a {
        color: #4f46e5;
        text-decoration: none;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 15px;
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h2 class="title">รีเซ็ตรหัสผ่าน</h2>

        <p class="description">กรุณากำหนดรหัสผ่านใหม่สำหรับบัญชี DormCare</p>

        <div id="message" class="message"></div>

        <form id="resetPasswordForm">
          <div class="form-group">
            <label for="password"> รหัสผ่านใหม่ </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="กรอกรหัสผ่านใหม่"
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword"> ยืนยันรหัสผ่านใหม่ </label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
              minlength="6"
              required
            />
          </div>

          <button type="submit" id="submitButton">เปลี่ยนรหัสผ่าน</button>

          <div id="loading" class="loading">กำลังเปลี่ยนรหัสผ่าน...</div>
        </form>

        <div class="login-link">
          <a href="/login"> กลับไปหน้าเข้าสู่ระบบ </a>
        </div>
      </div>
    </div>

    <script>
      // =========================================================
      // GET ACCESS TOKEN FROM SUPABASE RECOVERY URL
      // =========================================================

      function getAccessToken() {
        const hash = window.location.hash.substring(1);

        if (!hash) {
          return null;
        }

        const params = new URLSearchParams(hash);

        return params.get("access_token");
      }

      // =========================================================
      // SHOW MESSAGE
      // =========================================================

      function showMessage(message, type) {
        const messageElement = document.getElementById("message");

        messageElement.textContent = message;

        messageElement.className = "message " + type;

        messageElement.style.display = "block";
      }

      // =========================================================
      // RESET PASSWORD
      // =========================================================

      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const password = document.getElementById("password").value;

          const confirmPassword =
            document.getElementById("confirmPassword").value;

          const submitButton = document.getElementById("submitButton");

          const loading = document.getElementById("loading");

          // -------------------------------------------------
          // CHECK PASSWORD
          // -------------------------------------------------

          if (password.length < 6) {
            showMessage("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร", "error");

            return;
          }

          // -------------------------------------------------
          // CHECK CONFIRM PASSWORD
          // -------------------------------------------------

          if (password !== confirmPassword) {
            showMessage("รหัสผ่านไม่ตรงกัน", "error");

            return;
          }

          // -------------------------------------------------
          // GET ACCESS TOKEN
          // -------------------------------------------------

          const accessToken = getAccessToken();

          if (!accessToken) {
            showMessage(
              "ลิงก์รีเซ็ตรหัสผ่านไม่ถูกต้องหรือหมดอายุ กรุณาขอลิงก์ใหม่อีกครั้ง",
              "error",
            );

            return;
          }

          // -------------------------------------------------
          // DISABLE BUTTON
          // -------------------------------------------------

          submitButton.disabled = true;

          loading.style.display = "block";

          try {
            const response = await fetch("/api/v1/auth/reset-password", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                accessToken: accessToken,

                password: password,

                confirmPassword: confirmPassword,
              }),
            });

            const result = await response.json();

            // -------------------------------------------------
            // SUCCESS
            // -------------------------------------------------

            if (response.ok && result.success) {
              showMessage(
                "เปลี่ยนรหัสผ่านสำเร็จ กำลังกลับไปหน้าเข้าสู่ระบบ...",
                "success",
              );

              /*
               * ลบ recovery token ออกจาก URL
               * เพื่อไม่ให้ token ค้างอยู่ใน browser
               */
              window.history.replaceState(
                {},
                document.title,
                "/reset-password",
              );

              setTimeout(function () {
                window.location.href = "/login";
              }, 2000);

              return;
            }

            // -------------------------------------------------
            // ERROR FROM BACKEND
            // -------------------------------------------------

            showMessage(
              result.message || "ไม่สามารถเปลี่ยนรหัสผ่านได้",
              "error",
            );
          } catch (error) {
            console.error("Reset password error:", error);

            showMessage("เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบ", "error");
          } finally {
            submitButton.disabled = false;

            loading.style.display = "none";
          }
        });

      // =========================================================
      // CHECK TOKEN WHEN PAGE LOADS
      // =========================================================

      window.addEventListener("DOMContentLoaded", function () {
        const accessToken = getAccessToken();

        if (!accessToken) {
          showMessage(
            "ไม่พบลิงก์สำหรับรีเซ็ตรหัสผ่าน กรุณาเปิดลิงก์จาก Email อีกครั้ง",
            "error",
          );
        }
      });
    </script>
  </body>
</html>
