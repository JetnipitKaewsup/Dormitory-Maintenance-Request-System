<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DormCare - แก้ไขโปรไฟล์</title>
    <link rel="stylesheet" th:href="@{/css/reporter-notification.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/reporter.css}" />
    <script src="https://unpkg.com/lucide@latest"></script>
<meta name="_csrf"
      th:content="${_csrf.token}">

<meta name="_csrf_header"
      th:content="${_csrf.headerName}">
    <style>
      :root {
        --bg: #f1f4f9;
        --surface: #ffffff;
        --text: #16202e;
        --muted: #64748b;
        --line: #e3e8f0;
        --field-bg: #f5f7fb;
        --primary: #3465f0;
        --primary-dark: #254fcf;
        --primary-soft: #e8eefe;
        --danger: #d92d3a;
        --danger-soft: #fdecee;
        --success: #12805c;
        --success-soft: #e3f6ee;
      }

      body {
        background: var(--bg);
        font-family:
          "IBM Plex Sans Thai",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      .main-content {
        max-width: 820px;
        margin: 40px auto 64px;
        padding: 0 20px;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px 6px 8px;
        margin-bottom: 18px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.9rem;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s;
      }

      .back-btn svg {
        width: 18px;
        height: 18px;
      }

      .back-btn:hover {
        background: var(--surface);
        color: var(--text);
      }

      /* Card */
      .profile-card {
        background: var(--surface);
        border-radius: 20px;
        box-shadow:
          0 1px 2px rgba(22, 32, 46, 0.06),
          0 12px 32px -12px rgba(22, 32, 46, 0.14);
        overflow: hidden;
      }

      /* Identity header */
      .profile-hero {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 28px 32px;
        border-bottom: 1px solid var(--line);
      }

      .avatar {
        flex: none;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: #fff;
        font-size: 1.6rem;
        font-weight: 600;
      }

      .hero-text {
        min-width: 0;
      }

      .hero-name {
        font-size: 1.3rem;
        font-weight: 600;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary-dark);
        font-weight: 500;
      }

      .chip svg {
        width: 14px;
        height: 14px;
      }

      /* Body */
      .profile-body {
        padding: 8px 32px 32px;
      }

      .alert {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
      }

      .alert svg {
        flex: none;
        width: 18px;
        height: 18px;
      }

      .alert-success {
        background: var(--success-soft);
        color: var(--success);
      }

      .alert-error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .section {
        padding-top: 28px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        font-size: 1rem;
        font-weight: 600;
      }

      .section-note {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.8rem;
        font-weight: 400;
        color: var(--muted);
      }

      .section-note svg {
        width: 14px;
        height: 14px;
      }

      .profile-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 20px;
      }

      .profile-grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .form-group {
        min-width: 0;
      }

      .form-label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap > svg {
        position: absolute;
        top: 50%;
        width: 17px;
        height: 17px;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
      }

      .input-wrap .icon-start {
        left: 14px;
      }

      .input-wrap .icon-end {
        right: 14px;
      }

      .form-control {
        display: block;
        width: 100%;
        height: 44px;
        box-sizing: border-box;
        padding: 0 14px;
        border: 1.5px solid transparent;
        border-radius: 12px;
        background: var(--field-bg);
        color: var(--text);
        font: inherit;
        font-size: 0.95rem;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background 0.15s;
      }

      .input-wrap.has-start .form-control {
        padding-left: 42px;
      }

      .input-wrap.has-end .form-control {
        padding-right: 40px;
      }

      /* Read-only */
      .form-control[readonly] {
        color: #5b6778;
        cursor: not-allowed;
        text-overflow: ellipsis;
      }

      /* Editable field */
      .form-control:not([readonly]) {
        background: var(--surface);
        border-color: #c9d3e3;
      }

      .form-control:not([readonly]):hover {
        border-color: #9fb0cc;
      }

      .form-control:not([readonly]):focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(52, 101, 240, 0.16);
      }

      .form-control.is-invalid {
        border-color: var(--danger);
      }

      .field-error {
        margin: 6px 0 0;
        font-size: 0.8rem;
        color: var(--danger);
      }

      .field-hint {
        margin: 6px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* Actions */
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 36px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      .btn-cancel,
      .btn-save {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 22px;
        box-sizing: border-box;
        border-radius: 12px;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.05s;
      }

      .btn-cancel svg,
      .btn-save svg {
        width: 18px;
        height: 18px;
      }

      .btn-cancel {
        border: 1.5px solid var(--line);
        background: var(--surface);
        color: var(--muted);
      }

      .btn-cancel:hover {
        background: var(--field-bg);
        color: var(--text);
      }

      .btn-save {
        border: none;
        background: var(--primary);
        color: #fff;
        box-shadow: 0 6px 14px -6px rgba(52, 101, 240, 0.7);
      }

      .btn-save:hover {
        background: var(--primary-dark);
      }

      .btn-save:active {
        transform: translateY(1px);
      }

      .btn-cancel:focus-visible,
      .btn-save:focus-visible,
      .back-btn:focus-visible {
        outline: 3px solid rgba(52, 101, 240, 0.4);
        outline-offset: 2px;
      }

      /* Responsive */
      @media (max-width: 720px) {
        .profile-grid.three {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .main-content {
          margin: 24px auto 40px;
          padding: 0 14px;
        }

        .profile-hero {
          padding: 22px 20px;
        }

        .profile-body {
          padding: 4px 20px 24px;
        }

        .profile-grid,
        .profile-grid.three {
          grid-template-columns: 1fr;
        }

        .section-title {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }

        .form-actions {
          flex-direction: column-reverse;
        }

        .btn-cancel,
        .btn-save {
          width: 100%;
        }

        /* 16px prevents iOS zoom on focus */
        .form-control {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a th:href="@{/}" class="brand">
        <span>ระบบแจ้งซ่อมในหอพัก</span>
      </a>

      <div class="nav-actions">
        <!-- <button class="notification-btn" type="button">
          <i data-lucide="bell"></i>
          <span class="notification-dot"></span>
        </button> -->

        <!-- bell -->
         <div th:replace="~{reporter/reporter-notification :: notification}">
</div>

        <div class="user-profile">
          <div>
            <div
              th:if="${reporter != null and reporter.user != null}"
              th:text="${reporter.user.firstName + ' ' + reporter.user.lastName}"
            >
              สมชาย ใจดี
            </div>

            <div
              style="font-size: 0.75rem; opacity: 0.8"
              th:if="${reporter != null
                            and reporter.resident != null
                            and reporter.resident.room != null}"
              th:text="'ห้อง ' + ${reporter.resident.room.roomNo}"
            >
              ห้อง 302
            </div>
          </div>

          <form th:action="@{/logout}" method="post">
              <input type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

              <button type="submit"
                      class="logout-btn"
                      title="ออกจากระบบ">

                  <i data-lucide="log-out"></i>

              </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- TABS -->
    <div class="tabs-container">
      <a th:href="@{/reporter/add}" class="tab-btn"> แจ้งซ่อมใหม่ </a>

      <a th:href="@{/reporter/requests}" class="tab-btn"> ประวัติคำร้อง </a>

      <a th:href="@{/reporter/latest}" class="tab-btn"> คำร้องล่าสุด </a>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- BACK BUTTON -->
      <a th:href="@{/reporter/add}" class="back-btn">
        <i data-lucide="arrow-left"></i>
        กลับ
      </a>

      <!-- PROFILE CARD -->
      <div class="profile-card">
        <!-- IDENTITY HEADER -->
        <div class="profile-hero">
          <div
            class="avatar"
            aria-hidden="true"
            th:text="${reporter.user.firstName != null and !#strings.isEmpty(reporter.user.firstName)
                        ? #strings.substring(reporter.user.firstName, 0, 1) : '?'}"
          >
            ส
          </div>

          <div class="hero-text">
            <div
              class="hero-name"
              th:text="${reporter.user.firstName + ' ' + reporter.user.lastName}"
            >
              สมชาย ใจดี
            </div>

            <div class="hero-meta">
              <span
                class="chip"
                th:if="${reporter.resident != null and reporter.resident.room != null}"
              >
                <i data-lucide="door-open"></i>
                <span th:text="'ห้อง ' + ${reporter.resident.room.roomNo}"
                  >ห้อง 302</span
                >
              </span>
              <span th:text="${reporter.user.email}">somchai@example.com</span>
            </div>
          </div>
        </div>

        <div class="profile-body">
          <!-- SUCCESS MESSAGE -->
          <div
            th:if="${successMessage}"
            class="alert alert-success"
            role="status"
          >
            <i data-lucide="circle-check"></i>
            <span th:text="${successMessage}"></span>
          </div>

          <!-- ERROR MESSAGE -->
          <div th:if="${errorMessage}" class="alert alert-error" role="alert">
            <i data-lucide="circle-alert"></i>
            <span th:text="${errorMessage}"></span>
          </div>

          <!-- PROFILE FORM -->
          <form
            th:action="@{/reporter/profile/edit}"
            method="post"
            th:object="${profileForm}"
          >
          <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">
            <!-- ACCOUNT SECTION -->
            <section class="section">
              <div class="section-title">
                <span>ข้อมูลบัญชีผู้ใช้</span>
                <span class="section-note">
                  <i data-lucide="pencil"></i>
                  แก้ไขได้เฉพาะเบอร์โทรศัพท์
                </span>
              </div>

              <div class="profile-grid">
                <!-- FIRST NAME -->
                <div class="form-group">
                  <label class="form-label" for="firstName">ชื่อ</label>
                  <div class="input-wrap has-end">
                    <input
                      type="text"
                      id="firstName"
                      class="form-control"
                      th:value="${reporter.user.firstName}"
                      readonly
                    />
                    <i data-lucide="lock" class="icon-end"></i>
                  </div>
                </div>

                <!-- LAST NAME -->
                <div class="form-group">
                  <label class="form-label" for="lastName">สกุล</label>
                  <div class="input-wrap has-end">
                    <input
                      type="text"
                      id="lastName"
                      class="form-control"
                      th:value="${reporter.user.lastName}"
                      readonly
                    />
                    <i data-lucide="lock" class="icon-end"></i>
                  </div>
                </div>

                <!-- PHONE NUMBER (editable) -->
                <div class="form-group">
                  <label class="form-label" for="phoneNo">เบอร์ติดต่อ</label>
                  <div class="input-wrap has-start">
                    <i data-lucide="phone" class="icon-start"></i>
                    <input
                      type="tel"
                      id="phoneNo"
                      class="form-control"
                      th:field="*{phoneNo}"
                      th:classappend="${#fields.hasErrors('phoneNo')} ? 'is-invalid'"
                      placeholder="08XXXXXXXX"
                      maxlength="10"
                      pattern="[0-9]{10}"
                      title="กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
                      inputmode="numeric"
                      autocomplete="tel"
                      required
                    />
                  </div>
                  <p
                    class="field-error"
                    th:if="${#fields.hasErrors('phoneNo')}"
                    th:errors="*{phoneNo}"
                  ></p>
                  <p
                    class="field-hint"
                    th:unless="${#fields.hasErrors('phoneNo')}"
                  >
                    ตัวเลข 10 หลัก
                  </p>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                  <label class="form-label" for="email">ที่อยู่อีเมล</label>
                  <div class="input-wrap has-start has-end">
                    <i data-lucide="mail" class="icon-start"></i>
                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      th:value="${reporter.user.email}"
                      readonly
                    />
                    <i data-lucide="lock" class="icon-end"></i>
                  </div>
                </div>
              </div>
            </section>

            <!-- RESIDENCE SECTION -->
            <section class="section">
              <div class="section-title">
                <span>ที่พักอาศัย</span>
              </div>

              <div class="profile-grid three">
                <!-- DORM -->
                <div class="form-group">
                  <label class="form-label" for="dorm">หอ</label>
                  <div class="input-wrap has-end">
                    <input
                      type="text"
                      id="dorm"
                      class="form-control"
                      value="หอพัก"
                      readonly
                    />
                    <i data-lucide="lock" class="icon-end"></i>
                  </div>
                </div>

                <!-- BUILDING -->
                <div class="form-group">
                  <label class="form-label" for="building">ตึก</label>
                  <div class="input-wrap has-end">
                    <input
                      type="text"
                      id="building"
                      class="form-control"
                      th:value="${reporter.resident != null
                                    and reporter.resident.room != null
                                    and reporter.resident.room.building != null
                                    ? reporter.resident.room.building.buildingNo : ''}"
                      readonly
                    />
                    <i data-lucide="lock" class="icon-end"></i>
                  </div>
                </div>

                <!-- ROOM NUMBER -->
                <div class="form-group">
                  <label class="form-label" for="roomNo">หมายเลขห้อง</label>
                  <div class="input-wrap has-end">
                    <input
                      type="text"
                      id="roomNo"
                      class="form-control"
                      th:value="${reporter.resident != null
                                    and reporter.resident.room != null
                                    ? reporter.resident.room.roomNo : ''}"
                      readonly
                    />
                    <i data-lucide="lock" class="icon-end"></i>
                  </div>
                </div>
              </div>
            </section>

            <!-- BUTTONS -->
            <div class="form-actions">
              <a th:href="@{/reporter/requests}" class="btn-cancel">ยกเลิก</a>

              <button type="submit" class="btn-save">
                <i data-lucide="save"></i>
                บันทึกการแก้ไข
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      lucide.createIcons();

      // อนุญาตเฉพาะตัวเลขในช่องเบอร์โทรศัพท์
      const phoneInput = document.getElementById("phoneNo");

      phoneInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
      });
    </script>

    <!-- Reporter Notification JS -->
    <script th:src="@{/js/reporter-notification.js}"></script>
  </body>
</html>
