<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
      }

      .container {
        width: 500px;
        margin: 100px auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        margin-bottom: 20px;
      }

      .success {
        color: green;
        font-size: 18px;
        margin-bottom: 30px;
      }

      .logout {
        display: inline-block;
        padding: 10px 20px;
        background: #dc3545;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }

      .logout:hover {
        background: #bb2d3b;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Dashboard</h1>

      <p class="success" th:text="${message}">Login successful!</p>

      <p>You have successfully logged in.</p>

      <a href="/logout" class="logout"> Logout </a>
    </div>
  </body>
</html>
