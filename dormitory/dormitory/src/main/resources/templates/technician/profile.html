<!DOCTYPE html>
<html lang="th"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profile</title>

    <link rel="stylesheet"
          th:href="@{/css/technician-dailywork.css}">

    <link rel="stylesheet"
          th:href="@{/css/technician-profile.css}">


    <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet"
          th:href="@{/css/technician-notification.css}">

    <meta name="_csrf" th:content="${_csrf.token}">

    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->
<header class="topbar">

    <div class="brand">
        Dormitory Repair System
    </div>

    <div class="topbar-right">

        <!-- Technician Profile -->
        <a th:href="@{/technician/profile}"
           class="technician-profile">

            <div class="user-icon">
                <i data-lucide="user-round"></i>
            </div>

            <div class="technician-info">

                <div class="technician-name"
                     th:text="${technician.user.firstName}">
                    สมชาย ดีดี
                </div>

                <div class="technician-role">
                    ช่างซ่อม
                </div>

            </div>

        </a>


        <!-- =================================================
             NOTIFICATION COMPONENT
        ================================================== -->
        <div th:replace="~{Technician/technician-notification :: notification}"></div>


        <!-- Logout -->
        <a class="icon-button"
           th:href="@{/login}"
           title="ออกจากระบบ"
           aria-label="ออกจากระบบ">

            <i data-lucide="log-out"></i>

        </a>
    </div>

</header>



<main class="profile-page">

<!-- ปุ่มกลับ -->
<div class="back-section">
    <a th:href="@{/technician/dailywork}" class="back-button">
        <i data-lucide="arrow-left"></i>
        <span>กลับ</span>
    </a>
</div>

<!-- Profile Card -->
<section class="profile-card">

    <!-- Header -->
    <div class="profile-header">
        <i data-lucide="user-round"></i>
        <span>โปรไฟล์ช่าง</span>
        <i data-lucide="wrench" class="profile-header-decoration"></i>
    </div>

    <div class="profile-content">

        <!-- ข้อมูลหลักของช่าง -->
        <div class="profile-summary">

            <div class="profile-avatar-column">
                <div class="profile-icon">
                    <i data-lucide="wrench"></i>
                </div>

                <span class="profile-role-badge">ช่างซ่อม</span>
            </div>

            <div class="profile-summary-details">

                <h1 class="profile-name"
                    th:text="${technician.user.firstName
                        + ' ' + technician.user.lastName}">
                    วิชัย เย่
                </h1>

                <div class="profile-subtitle">ช่างซ่อม</div>

                <div class="profile-contact-row">

                    <div class="profile-contact">
                        <div class="profile-contact-icon">
                            <i data-lucide="phone"></i>
                        </div>

                        <div>
                            <div class="profile-contact-label">
                                เบอร์โทรศัพท์
                            </div>
                            <div class="profile-contact-value"
                                 th:text="${technician.user.phoneNo}">
                                0875151515
                            </div>
                        </div>
                    </div>

                    <div class="profile-contact-divider"></div>

                    <div class="profile-contact">
                        <div class="profile-contact-icon">
                            <i data-lucide="user-round"></i>
                        </div>

                        <div>
                            <div class="profile-contact-label">
                                ตำแหน่ง
                            </div>
                            <div class="profile-contact-value">
                                ช่างซ่อม
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- รายละเอียดเพิ่มเติม -->
        <section class="profile-details-panel">

            <h2 class="profile-section-title">
                <span class="profile-section-title-icon">
                    <i data-lucide="user-round"></i>
                </span>
                ข้อมูลส่วนตัว
            </h2>

            <div class="profile-info-list">

                <div class="info-row">
                    <span class="info-icon">
                        <i data-lucide="user-round"></i>
                    </span>

                    <span class="info-label">ชื่อ</span>

                    <span class="info-value"
                          th:text="${technician.user.firstName
                              + ' ' + technician.user.lastName}">
                        สมชาย ดีดี
                    </span>
                </div>

                <div class="info-row">
                    <span class="info-icon">
                        <i data-lucide="briefcase-business"></i>
                    </span>

                    <span class="info-label">งาน</span>

                    <span class="info-value"
                          th:text="${technician.specialization}">
                        งานน้ำ
                    </span>
                </div>

                <div class="info-row">
                    <span class="info-icon">
                        <i data-lucide="phone"></i>
                    </span>

                    <span class="info-label">เบอร์โทรศัพท์</span>

                    <span class="info-value"
                          th:text="${technician.user.phoneNo}">
                        0875151515
                    </span>
                </div>

            </div>
        </section>


    </div>
</section>


</main>


<!-- =====================================================
     TECHNICIAN NOTIFICATION JS
===================================================== -->

<script th:src="@{/js/technician-notification.js}"></script>


<script>
    lucide.createIcons();
</script>
</body>
</html>
