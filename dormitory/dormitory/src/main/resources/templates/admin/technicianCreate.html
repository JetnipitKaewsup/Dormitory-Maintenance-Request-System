<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>สร้าง Account ช่าง - Dormitory Repair System</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}" />
    <link rel="stylesheet" th:href="@{/css/adminTechnician.css}" />
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('technicians')}"></div>

<main>
    <div class="page-head">
        <div>
            <h1 class="page-title">สร้าง Account ช่าง</h1>
            <p class="page-sub">สร้างบัญชีสำหรับช่างใหม่ ช่างจะได้รับอีเมลยืนยันตัวตนก่อน login ครั้งแรก</p>
        </div>
        <a class="btn btn-outline" th:href="@{/admin/technicians}">&larr; กลับหน้ารายชื่อ</a>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="card" style="max-width:640px;">
        <form method="post" th:action="@{/admin/technicians/create}" th:object="${createRequest}">

            <div class="form-row">
                <div class="form-group">
                    <label>ชื่อ</label>
                    <input type="text" th:field="*{firstName}" />
                    <div class="form-hint" style="color:var(--color-danger);"
                         th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="form-group">
                    <label>นามสกุล</label>
                    <input type="text" th:field="*{lastName}" />
                    <div class="form-hint" style="color:var(--color-danger);"
                         th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}" />
                <div class="form-hint" style="color:var(--color-danger);"
                     th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>อีเมล</label>
                    <input type="email" th:field="*{email}" />
                    <div class="form-hint" style="color:var(--color-danger);"
                         th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    <div class="form-hint">ช่างต้องกดยืนยันลิงก์ในอีเมลนี้ก่อนถึงจะ login ได้</div>
                </div>
                <div class="form-group">
                    <label>เบอร์โทรศัพท์</label>
                    <input type="tel" th:field="*{phoneNo}" />
                    <div class="form-hint" style="color:var(--color-danger);"
                         th:if="${#fields.hasErrors('phoneNo')}" th:errors="*{phoneNo}"></div>
                </div>
            </div>

            <div class="form-group">
                <label>ความเชี่ยวชาญ</label>
                <select th:field="*{specialization}">
                    <option value="">-- เลือกความเชี่ยวชาญ --</option>
                    <option value="electric">ไฟฟ้า</option>
                    <option value="plumbing">ประปา</option>
                    <option value="aircon">แอร์</option>
                    <option value="general">งานทั่วไป</option>
                </select>
                <div class="form-hint" style="color:var(--color-danger);"
                     th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></div>
            </div>

            <div class="form-group">
                <label>รหัสผ่านเริ่มต้น</label>
                <input type="password" th:field="*{password}" />
                <div class="form-hint" style="color:var(--color-danger);"
                     th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <div class="form-hint">ช่างสามารถเปลี่ยนรหัสผ่านเองภายหลังได้</div>
            </div>

            <div class="form-actions">
                <a class="btn btn-outline" th:href="@{/admin/technicians}">ยกเลิก</a>
                <button type="submit" class="btn btn-approve">สร้างบัญชี</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
