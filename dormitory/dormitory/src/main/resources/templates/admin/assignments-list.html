<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>มอบหมายงาน</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}">
    <link rel="stylesheet" th:href="@{/css/admin-worklist.css}">
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('assignments')}"></div>

<div class="page">
    <h2>รายการคำร้องที่รอมอบหมายงาน</h2>

    <div class="empty" th:if="${#lists.isEmpty(requests)}">
        ไม่มีคำร้องที่รอมอบหมายงานในขณะนี้
    </div>

    <div class="work-item" th:each="r : ${requests}">
        <div>
            <strong th:text="${r.repairType}"></strong>
            <span th:text="' - ' + ${r.description}"></span>
            <div class="meta" th:text="'ห้อง ' + (${r.room != null ? r.room.roomNo : '-'})"></div>
        </div>
        <a class="btn" th:href="@{/admin/requests/{id}/assign(id=${r.repairRequestId})}">มอบหมายงาน</a>
    </div>
</div>

</body>
</html>
