<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>รายการคำร้องแจ้งซ่อม</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}">
    <link rel="stylesheet" th:href="@{/css/requests-list.css}">
</head>
<body>


<div th:replace="~{admin/adminHeader :: adminHeader('requests')}"></div>

<div class="welcome-banner">
    <div>
        <div class="welcome-title">ยินดีต้อนรับ, <span th:text="${session.userFullName} ?: 'แอดมิน'">แอดมิน</span></div>
        <div class="welcome-subtitle">ตรวจสอบและจัดการคำร้องแจ้งซ่อมได้ที่นี่</div>
    </div>
</div>

<main>
    <!-- ============ สรุปสถานะ (stat cards) ============ -->
    <div class="stat-cards">
        <div class="stat-card stat-pending">
            <div class="stat-label">รอดำเนินการ</div>
            <div class="stat-value" th:text="${pendingCount}">0</div>
        </div>
        <div class="stat-card stat-approved">
            <div class="stat-label">อนุมัติ</div>
            <div class="stat-value" th:text="${approvedCount}">0</div>
        </div>
        <div class="stat-card stat-progress">
            <div class="stat-label">กำลังดำเนินการ</div>
            <div class="stat-value" th:text="${inProgressCount}">0</div>
        </div>
        <div class="stat-card stat-completed">
            <div class="stat-label">เสร็จสิ้น</div>
            <div class="stat-value" th:text="${completedCount}">0</div>
        </div>
        <div class="stat-card stat-rejected">
            <div class="stat-label">ไม่อนุมัติ</div>
            <div class="stat-value" th:text="${rejectedCount}">0</div>
        </div>
    </div>

    <!-- ============ ตารางคำร้อง ============ -->
    <div class="card">
        <h2 class="table-title">รายการแจ้งซ่อมทั้งหมด</h2>

        <!-- แถบ filter ตามสถานะ -->
        <div class="filter-row">
            <button class="filter-chip active" data-filter-status="all"
                    th:text="'ทั้งหมด (' + ${#lists.size(requests)} + ')'">ทั้งหมด</button>
            <button class="filter-chip" data-filter-status="PENDING">รอดำเนินการ</button>
            <button class="filter-chip" data-filter-status="APPROVED">อนุมัติ</button>
            <button class="filter-chip" data-filter-status="IN_PROGRESS">กำลังดำเนินการ</button>
            <button class="filter-chip" data-filter-status="COMPLETED">เสร็จสิ้น</button>
            <button class="filter-chip" data-filter-status="IN_COMPLETED">ไม่สำเร็จ</button>
            <button class="filter-chip" data-filter-status="REJECTED,CANCELLED">ไม่อนุมัติ / ยกเลิก</button>
        </div>

        <!-- แถบ filter ตามประเภทงาน -->
        <div class="filter-row filter-row-secondary">
            <button class="filter-chip filter-chip-outline" data-filter-type="all">ทั้งหมด</button>
            <button class="filter-chip filter-chip-outline" data-filter-type="ELECTRICAL">งานไฟฟ้า</button>
            <button class="filter-chip filter-chip-outline" data-filter-type="CARPENTRY">งานช่างไม้</button>
            <button class="filter-chip filter-chip-outline" data-filter-type="PLUMBING">งานประปา</button>
            <button class="filter-chip filter-chip-outline" data-filter-type="OTHER">อื่น ๆ</button>
        </div>

        <table class="requests-table">
            <thead>
                <tr>
                    <th>รหัสคำร้อง</th>
                    <th>ผู้แจ้ง</th>
                    <th>ห้องพัก</th>
                    <th>ประเภทงาน</th>
                    <th>สถานะ</th>
                    <th>วันที่แจ้ง</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <!-- data-status / data-type ต้องเป็นค่า enum เดิม ใช้กับตัวกรองและสีป้าย -->
                <tr th:each="request : ${requests}"
                    th:attr="data-status=${request.status},data-type=${request.repairType}">
                    <td th:text="${request.repairRequestId}">-</td>
                    <td th:text="${request.reporter.user.firstName} + ' ' + ${request.reporter.user.lastName}">-</td>
                    <td th:text="${request.room.building.buildingName} + ' / ห้อง ' + ${request.room.roomNo}">-</td>
                    <td th:text="${request.repairType != null ? request.repairType.thaiName : '-'}">-</td>
                    <td>
                        <span class="badge" th:classappend="${request.status.cssClass}"
                              th:text="${request.status.thaiName}">สถานะ</span>
                    </td>
                    <td th:text="${T(com.example.dormitory.util.ThaiDateUtil).formatDate(request.startDateTime)}">-</td>
                    <td>
                        <a class="btn btn-outline" th:href="@{/admin/requests/{id}(id=${request.repairRequestId})}">ดูรายละเอียด</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="7" class="empty-row">ยังไม่มีคำร้องแจ้งซ่อมในระบบ</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const statusChips = document.querySelectorAll('[data-filter-status]');
    const typeChips = document.querySelectorAll('[data-filter-type]');
    const rows = document.querySelectorAll('.requests-table tbody tr[data-status]');

    let activeStatus = 'all';
    let activeType = 'all';

    function applyFilter() {
        rows.forEach(row => {
            const rowStatus = row.getAttribute('data-status');
            const rowType = row.getAttribute('data-type');
            const statusOk = activeStatus === 'all' || activeStatus.split(',').includes(rowStatus);
            const typeOk = activeType === 'all' || activeType === rowType;
            row.style.display = (statusOk && typeOk) ? '' : 'none';
        });
    }

    statusChips.forEach(chip => chip.addEventListener('click', () => {
        statusChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeStatus = chip.getAttribute('data-filter-status');
        applyFilter();
    }));

    typeChips.forEach(chip => chip.addEventListener('click', () => {
        typeChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeType = chip.getAttribute('data-filter-type');
        applyFilter();
    }));
});
</script>

</body>
</html>
