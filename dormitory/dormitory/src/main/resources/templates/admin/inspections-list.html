<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ตรวจงาน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}">
    <link rel="stylesheet" th:href="@{/css/admin-worklist.css}">
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('inspections')}"></div>

<main class="work-page">
    <div class="work-head">
        <h1>รายการงานที่กำลังดำเนินการ</h1>
        <div class="work-head-side">
            <span class="work-ready-count" th:if="${readyCount > 0}"
                  th:text="'รอตรวจสอบ ' + ${readyCount} + ' งาน'"></span>
            <span class="work-count" th:text="${#lists.size(requests)} + ' งาน'"></span>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(requests)}">
        <div class="empty-icon">✓</div>
        <p>ไม่มีงานที่กำลังดำเนินการในขณะนี้</p>
    </div>

    <div class="work-list">
        <div class="work-row" th:each="r : ${requests}"
             th:classappend="${readyIds.contains(r.repairRequestId)} ? 'is-ready' : ''">
            <span class="work-status" aria-hidden="true"></span>

            <div class="work-body">
                <div class="work-title-line">
                    <span class="work-type" th:text="${r.repairType != null ? r.repairType.thaiName : '-'}">...</span>
                    <span class="work-badge work-badge-ready"
                          th:if="${readyIds.contains(r.repairRequestId)}">ช่างแจ้งเสร็จแล้ว รอตรวจสอบ</span>
                    <span class="work-badge"
                          th:unless="${readyIds.contains(r.repairRequestId)}">กำลังดำเนินการ</span>
                </div>
                <p class="work-desc" th:text="${r.description}"></p>
                <p class="work-meta" th:text="'ห้อง ' + (${r.room != null ? r.room.roomNo : '-'})"></p>
            </div>

            <a class="work-btn"
               th:classappend="${readyIds.contains(r.repairRequestId)} ? '' : 'work-btn-quiet'"
               th:href="@{/admin/requests/{id}/inspect(id=${r.repairRequestId})}">
                ตรวจสอบงาน
            </a>
        </div>
    </div>
</main>

</body>
</html>
