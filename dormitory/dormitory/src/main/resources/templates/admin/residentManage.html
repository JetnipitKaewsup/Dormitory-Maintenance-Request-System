<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>จัดการผู้พักอาศัย - Dormitory Repair System</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}" />
    <link rel="stylesheet" th:href="@{/css/adminTechnician.css}" />
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('residents')}"></div>

<main>
    <div class="page-head">
        <div>
            <h1 class="page-title">จัดการผู้พักอาศัย</h1>
            <p class="page-sub">ดูข้อมูลและแก้ไขข้อมูลผู้พักอาศัยในหอพัก</p>
        </div>
        <a class="btn btn-approve" th:href="@{/admin/residents/create}">+ เพิ่มผู้พักอาศัย</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อ หรือเลขห้อง..." />
    </div>

    <div class="tech-list" id="residentList" th:if="${residents != null and !residents.isEmpty()}">
        <div class="tech-card"
             th:each="res : ${residents}"
             th:attr="data-name=${res.firstName + ' ' + res.lastName}, data-room=${res.roomNo}">
            <div class="tech-main">
                <div class="tech-avatar" th:text="${#strings.substring(res.firstName,0,1)}">ก</div>
                <div>
                    <div class="tech-name"
                         th:text="${res.firstName + ' ' + res.lastName}">ชื่อ นามสกุล</div>
                    <div class="card-meta-row">
                        <span class="meta-item">
                            <!-- ✅ Lucide: Phone icon -->
                            <i data-lucide="phone" class="meta-icon meta-icon-phone"></i>
                            <strong th:text="${res.phoneNo}">0812345678</strong>
                        </span>
                        <span class="meta-item">
                            <!-- ✅ Lucide: Home icon -->
                            <i data-lucide="home" class="meta-icon meta-icon-room"></i>
                            ห้อง <strong th:text="${res.roomNo}">A101</strong>
                        </span>
                    </div>
                </div>
            </div>
            <div class="tech-actions">
                <button type="button" class="btn btn-outline edit-btn"
                        th:attr="data-id=${res.residentId},
                                 data-firstname=${res.firstName},
                                 data-lastname=${res.lastName},
                                 data-phone=${res.phoneNo},
                                 data-room=${res.roomNo}">
                    แก้ไข
                </button>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${residents == null or residents.isEmpty()}">
        ยังไม่มีข้อมูลผู้พักอาศัยในระบบ
    </div>
    <div class="empty-state" id="noResultState" style="display:none;">
        ไม่พบผู้พักอาศัยที่ตรงกับคำค้นหา
    </div>
</main>

<div class="modal-backdrop" id="editModalBackdrop">
    <div class="modal">
        <h3>แก้ไขข้อมูลผู้พักอาศัย</h3>
        <p class="sub">แก้ไขข้อมูลส่วนตัวและห้องพัก</p>

        <form method="post" th:action="@{/admin/residents/update}">
            <input type="hidden" name="residentId" id="edit-residentId" />

            <div class="form-group">
                <label>ชื่อ</label>
                <input type="text" name="firstName" id="edit-firstName" required />
            </div>
            <div class="form-group">
                <label>นามสกุล</label>
                <input type="text" name="lastName" id="edit-lastName" required />
            </div>
            <div class="form-group">
                <label>เบอร์โทรศัพท์</label>
                <input type="text" name="phoneNo" id="edit-phoneNo" />
            </div>

            <div class="form-group">
                <label>เลขห้อง</label>
                <div class="room-combobox">
                    <input type="text"
                           id="edit-roomSearch"
                           placeholder="พิมพ์เลขห้อง..."
                           autocomplete="off" />
                    <div class="dropdown" id="edit-roomDropdown">
                        <div th:each="room : ${rooms}"
                             class="dropdown-item edit-room-option"
                             th:data-room-no="${room.roomNo}"
                             th:data-search="${room.roomNo + ' ' + room.building.buildingName}"
                             th:text="'ห้อง ' + ${room.roomNo} + ' (' + ${room.building.buildingName} + ')'">
                        </div>
                        <div class="dropdown-empty edit-room-empty" style="display:none;">
                            ไม่พบห้องที่ตรงกับคำค้นหา
                        </div>
                    </div>
                </div>
                <input type="hidden" name="roomNo" id="edit-roomNo" />
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="cancelEditBtn">ยกเลิก</button>
                <button type="submit" class="btn btn-approve">บันทึก</button>
            </div>
        </form>
    </div>
</div>

<!-- ✅ Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script>
(function () {
    // ============================================
    // ✅ Lucide: แทน <i data-lucide="..."> → SVG
    // ============================================
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }

    // ============================================
    // Modal logic
    // ============================================
    const editModalBackdrop = document.getElementById('editModalBackdrop');
    const editRoomSearch    = document.getElementById('edit-roomSearch');
    const editRoomDropdown  = document.getElementById('edit-roomDropdown');
    const editRoomNo        = document.getElementById('edit-roomNo');
    const editRoomEmpty     = document.querySelector('.edit-room-empty');
    const editRoomOptions   = Array.from(document.querySelectorAll('.edit-room-option'));

    function openDropdown() {
        editRoomDropdown.classList.add('open');
    }

    function closeDropdown() {
        editRoomDropdown.classList.remove('open');
    }

    function filterRooms() {
        const keyword = editRoomSearch.value.toLowerCase().trim();
        let found = 0;

        editRoomOptions.forEach(function (opt) {
            const match = opt.dataset.search.toLowerCase().includes(keyword);
            opt.style.display = match ? 'block' : 'none';
            if (match) found++;
        });

        editRoomEmpty.style.display = (found === 0 && keyword !== '') ? 'block' : 'none';
        openDropdown();
    }

    editRoomSearch.addEventListener('focus', filterRooms);
    editRoomSearch.addEventListener('input', function () {
        editRoomNo.value = '';
        filterRooms();
    });

    editRoomOptions.forEach(function (opt) {
        opt.addEventListener('click', function () {
            editRoomSearch.value = opt.textContent.trim();
            editRoomNo.value = opt.dataset.roomNo;
            closeDropdown();
        });
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('#editModalBackdrop .room-combobox')) closeDropdown();
    });

    document.querySelectorAll('.edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('edit-residentId').value = btn.dataset.id;
            document.getElementById('edit-firstName').value = btn.dataset.firstname;
            document.getElementById('edit-lastName').value = btn.dataset.lastname;
            document.getElementById('edit-phoneNo').value = btn.dataset.phone;

            const currentRoom = btn.dataset.room;
            editRoomNo.value = currentRoom;

            const matched = editRoomOptions.find(function (opt) {
                return opt.dataset.roomNo === currentRoom;
            });
            editRoomSearch.value = matched ? matched.textContent.trim() : currentRoom;

            editModalBackdrop.classList.add('open');
        });
    });

    document.getElementById('cancelEditBtn').addEventListener('click', function () {
        editModalBackdrop.classList.remove('open');
    });

    editModalBackdrop.addEventListener('click', function (e) {
        if (e.target === editModalBackdrop) {
            editModalBackdrop.classList.remove('open');
        }
    });

    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.tech-card');
    const noResultState = document.getElementById('noResultState');

    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const keyword = searchInput.value.trim().toLowerCase();
            let visibleCount = 0;
            cards.forEach(function (card) {
                const name = (card.dataset.name || '').toLowerCase();
                const room = (card.dataset.room || '').toLowerCase();
                const match = keyword === '' || name.includes(keyword) || room.includes(keyword);
                card.style.display = match ? 'flex' : 'none';
                if (match) visibleCount++;
            });
            noResultState.style.display = (cards.length > 0 && visibleCount === 0) ? 'block' : 'none';
        });
    }
})();
</script>

</body>
</html>
