<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>ประวัติการแจ้งซ่อม - Dormitory Repair System</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}" />
    <link rel="stylesheet" th:href="@{/css/adminTechnician.css}" />
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('reporters')}"></div>

<main>
    <div class="page-head">
        <div>
            <h1 class="page-title"
                th:text="'ประวัติการแจ้งซ่อม - ' + ${reporter.firstName} + ' ' + ${reporter.lastName}">
                ประวัติการแจ้งซ่อม
            </h1>
            <p class="page-sub" th:text="'@' + ${reporter.username} + ' · ห้อง ' + ${reporter.roomNo}">
                ข้อมูลผู้แจ้ง
            </p>
        </div>
        <a class="btn btn-outline" th:href="@{/admin/reporters}">&larr; กลับหน้ารายชื่อ</a>
    </div>

    <div class="tech-list" th:if="${history != null and !history.isEmpty()}">
        <div class="tech-card" th:each="req : ${history}" style="flex-direction: column; align-items: flex-start;">

            <!-- Header: ประเภท + สถานะ -->
            <div style="display:flex; justify-content: space-between; width:100%;">
                <span class="tech-spec-badge" th:text="${req.repairType}">ประเภทงาน</span>
                <span class="badge"
                      th:classappend="${req.status == 'PENDING'} ? ' pending' :
                                      (${req.status == 'APPROVED'} ? ' approved' :
                                      (${req.status == 'REJECTED'} ? ' rejected' :
                                      (${req.status == 'IN_PROGRESS'} ? ' inprogress' :
                                      (${req.status == 'COMPLETED'} ? ' completed' : ''))))"
                      th:text="${req.status}">สถานะ</span>
            </div>

            <!-- Description -->
            <p style="margin-top:10px; font-size:14px;" th:text="${req.description}">รายละเอียด</p>

            <!-- Timeline -->
            <div class="history-timeline" style="margin-top:10px; width:100%;">

                <!-- 1. แจ้งเมื่อ -->
                <div class="timeline-item" th:if="${req.createdAt != null}">
                    <span class="dot reported"></span>
                    <span class="tl-label">แจ้งเมื่อ:</span>
                    <span class="tl-value"
                          th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}">
                        07/10/2026 12:48
                    </span>
                </div>

                <!-- 2. มอบหมายให้ช่าง -->
                <div class="timeline-item" th:if="${req.assignDate != null}">
                    <span class="dot started"></span>
                    <span class="tl-label">เริ่มซ่อม:</span>
                    <span class="tl-value"
                          th:text="${#temporals.format(req.assignDate, 'dd/MM/yyyy HH:mm')}">
                        07/10/2026 14:47
                    </span>
                </div>

                <!-- 3. ซ่อมเสร็จ (เฉพาะ COMPLETED / IN_COMPLETED) -->
                <div class="timeline-item" th:if="${req.completeDate != null}">
                    <span class="dot finished"></span>
                    <span class="tl-label">ซ่อมเสร็จ:</span>
                    <span class="tl-value"
                          th:text="${#temporals.format(req.completeDate, 'dd/MM/yyyy HH:mm')}">
                        07/10/2026 16:47
                    </span>
                </div>

            </div>

        </div>
    </div>

    <div class="empty-state" th:if="${history == null or history.isEmpty()}">
        ผู้แจ้งคนนี้ยังไม่เคยส่งคำร้องซ่อม
    </div>
</main>

</body>
</html>
