<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>จัดการผู้แจ้ง - Dormitory Repair System</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}" />
    <link rel="stylesheet" th:href="@{/css/adminTechnician.css}" />
            <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <link
            rel="stylesheet"
            th:href="@{/css/admin-notification.css}">

    <script
            src="https://unpkg.com/lucide@latest">
    </script>
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('reporters')}"></div>

<main>
    <div class="page-head">
        <div>
            <h1 class="page-title">จัดการผู้แจ้ง (Reporter)</h1>
            <p class="page-sub">ดูข้อมูลและแก้ไขข้อมูลส่วนตัวของผู้แจ้งทั้งหมด</p>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อ, username หรือห้อง..." />
    </div>

    <div class="tech-list" id="reporterList" th:if="${reporters != null and !reporters.isEmpty()}">
        <div class="tech-card"
             th:each="rep : ${reporters}"
             th:attr="data-name=${rep.firstName + ' ' + rep.lastName},
                      data-username=${rep.username},
                      data-room=${rep.roomNo}">
            <div class="tech-main">
                <div class="tech-avatar" th:text="${#strings.substring(rep.firstName,0,1)}">ก</div>
                <div>
                    <div class="tech-name"
                         th:text="${rep.firstName + ' ' + rep.lastName}">ชื่อ นามสกุล</div>
                    <div class="tech-meta"
                         th:text="'@' + ${rep.username} + ' · ' + ${rep.phoneNo} + ' · ห้อง ' + ${rep.roomNo}">@username · เบอร์โทร · ห้อง</div>
                </div>
            </div>
            <div class="tech-actions">
                <button type="button" class="btn btn-outline edit-btn"
                        th:attr="data-id=${rep.reporterId},
                                 data-firstname=${rep.firstName},
                                 data-lastname=${rep.lastName},
                                 data-phone=${rep.phoneNo}">
                    แก้ไข
                </button>
                 <a class="btn btn-outline" th:href="@{'/admin/reporters/' + ${rep.reporterId} + '/history'}">ดูประวัติ</a>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${reporters == null or reporters.isEmpty()}">
        ยังไม่มีข้อมูลผู้แจ้งในระบบ
    </div>
    <div class="empty-state" id="noResultState" style="display:none;">
        ไม่พบผู้แจ้งที่ตรงกับคำค้นหา
    </div>
</main>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModalBackdrop">
    <div class="modal">
        <h3>แก้ไขข้อมูลผู้แจ้ง</h3>
        <p class="sub">แก้ไขข้อมูลส่วนตัว</p>

        <form method="post" th:action="@{/admin/reporters/update}">
            <input type="hidden" name="reporterId" id="edit-reporterId" />

            <div class="form-group">
                <label>ชื่อ</label>
                <input type="text" name="firstName" id="edit-firstName" required />
            </div>
            <div class="form-group">
                <label>นามสกุล</label>
                <input type="text" name="lastName" id="edit-lastName" required />
            </div>
            <div class="form-group">
                <label>เบอร์โทรศัพท์</label>
                <input type="text" name="phoneNo" id="edit-phoneNo" />
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="cancelEditBtn">ยกเลิก</button>
                <button type="submit" class="btn btn-approve">บันทึก</button>
            </div>
        </form>
    </div>
</div>

<script>
    const editModalBackdrop = document.getElementById('editModalBackdrop');

    document.querySelectorAll('.edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('edit-reporterId').value = btn.dataset.id;
            document.getElementById('edit-firstName').value = btn.dataset.firstname;
            document.getElementById('edit-lastName').value = btn.dataset.lastname;
            document.getElementById('edit-phoneNo').value = btn.dataset.phone;
            editModalBackdrop.classList.add('open');
        });
    });
    document.getElementById('cancelEditBtn').addEventListener('click', function () {
        editModalBackdrop.classList.remove('open');
    });
    editModalBackdrop.addEventListener('click', function (e) {
        if (e.target === editModalBackdrop) editModalBackdrop.classList.remove('open');
    });

    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.tech-card');
    const noResultState = document.getElementById('noResultState');

    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const keyword = searchInput.value.trim().toLowerCase();
            let visibleCount = 0;
            cards.forEach(function (card) {
                const name = (card.dataset.name || '').toLowerCase();
                const username = (card.dataset.username || '').toLowerCase();
                const room = (card.dataset.room || '').toLowerCase();
                const match = keyword === '' || name.includes(keyword) || username.includes(keyword) || room.includes(keyword);
                card.style.display = match ? 'flex' : 'none';
                if (match) visibleCount++;
            });
            noResultState.style.display = (cards.length > 0 && visibleCount === 0) ? 'block' : 'none';
        });
    }
</script>
<script>
    lucide.createIcons();
</script>
</body>
</html>
