<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>ประวัติการซ่อม - Dormitory Repair System</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}" />
    <link rel="stylesheet" th:href="@{/css/adminTechnician.css}" />
</head>
<body>

<div th:replace="~{admin/adminHeader :: adminHeader('technicians')}"></div>

<main>
    <div class="page-head">
        <div>
            <h1 class="page-title"
                th:text="'ประวัติการซ่อม - ' + ${technician.firstName} + ' ' + ${technician.lastName}">
                ประวัติการซ่อม
            </h1>
            <p class="page-sub"
               th:text="'@' + ${technician.username} + ' · ความเชี่ยวชาญ: ' + ${technician.specialization}">
                ข้อมูลช่าง
            </p>
        </div>
        <a class="btn btn-outline" th:href="@{/admin/technicians}">&larr; กลับหน้ารายชื่อ</a>
    </div>

    <div class="tech-list" th:if="${history != null and !history.isEmpty()}">
        <div class="tech-card history-card" th:each="job : ${history}">

            <div class="history-card-header">
                <div class="left-meta">
                    <span class="meta-label">ประเภท</span>
                    <span class="tech-spec-badge" th:text="${job.repairType}">ELECTRICAL</span>
                </div>
                <span class="badge" th:classappend="${job.statusCssClass}"
                      th:text="${job.statusLabel}">PENDING</span>
            </div>

            <div class="history-title" th:text="${job.description}">ไฟดับบัง</div>

            <div class="history-timeline">
                <!-- 1. แจ้งเมื่อ -->
                <div class="timeline-item" th:if="${job.reportDate != null}">
                    <span class="dot reported"></span>
                    <span class="tl-label">แจ้งเมื่อ:</span>
                    <span class="tl-value"
                          th:text="${#temporals.format(job.reportDate, 'dd/MM/yyyy HH:mm')}">
                        07/10/2026 12:48
                    </span>
                </div>

                <!-- 2. เริ่มซ่อม (assign) -->
                <div class="timeline-item" th:if="${job.assignDate != null}">
                    <span class="dot started"></span>
                    <span class="tl-label">เริ่มซ่อม:</span>
                    <span class="tl-value"
                          th:text="${#temporals.format(job.assignDate, 'dd/MM/yyyy HH:mm')}">
                        07/10/2026 14:47
                    </span>
                </div>

                <!-- 3. ซ่อมเสร็จ -->
                <div class="timeline-item" th:if="${job.completeDate != null}">
                    <span class="dot finished"></span>
                    <span class="tl-label">ซ่อมเสร็จ:</span>
                    <span class="tl-value"
                          th:text="${#temporals.format(job.completeDate, 'dd/MM/yyyy HH:mm')}">
                        07/10/2026 16:47
                    </span>
                </div>
            </div>

            <div class="history-notes"
                 th:if="${(job.adminNote != null and !job.adminNote.isEmpty()) or (job.technicianNote != null and !job.technicianNote.isEmpty())}">

                <div class="note-block admin"
                     th:if="${job.adminNote != null and !job.adminNote.isEmpty()}">
                    <span class="note-label">แอดมิน:</span>
                    <span class="note-text" th:text="${job.adminNote}">หมายเหตุ</span>
                </div>

                <div class="note-block technician"
                     th:if="${job.technicianNote != null and !job.technicianNote.isEmpty()}">
                    <span class="note-label">ช่าง:</span>
                    <span class="note-text" th:text="${job.technicianNote}">หมายเหตุ</span>
                </div>
            </div>

        </div>
    </div>

    <div class="empty-state" th:if="${history == null or history.isEmpty()}">
        ช่างคนนี้ยังไม่เคยได้รับมอบหมายงานซ่อม
    </div>
</main>

</body>
</html>
