<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>เพิ่มผู้พักอาศัย - Dormitory Repair System</title>
    <link rel="stylesheet" th:href="@{/css/adminCommon.css}" />
    <link rel="stylesheet" th:href="@{/css/adminTechnician.css}" />
</head>

<body>
<div th:replace="~{admin/adminHeader :: adminHeader('residents')}"></div>

<main class="form-page">

    <div class="page-head">
        <div>
            <h1 class="page-title">เพิ่มผู้พักอาศัย</h1>
            <p class="page-sub">เพิ่มข้อมูลผู้พักอาศัยในหอพัก (ไม่มีบัญชีผู้ใช้/การเข้าสู่ระบบ)</p>
        </div>
        <a class="btn btn-outline" th:href="@{/admin/residents}">
            <!-- Lucide: Arrow left -->
            <i data-lucide="arrow-left" class="btn-icon"></i>
            กลับหน้ารายชื่อ
        </a>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="post"
          th:action="@{/admin/residents/create}"
          th:object="${createRequest}">

        <div class="section-card">

            <div class="section-header">
                <!-- Lucide: User -->
                <div class="section-icon">
                    <i data-lucide="user"></i>
                </div>
                <div class="section-text">
                    <div class="section-title">ข้อมูลส่วนตัว</div>
                    <div class="section-sub">ชื่อ-นามสกุล และเบอร์ติดต่อ</div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ชื่อ</label>
                    <input type="text" th:field="*{firstName}" />
                    <div class="form-hint error"
                         th:if="${#fields.hasErrors('firstName')}"
                         th:errors="*{firstName}"></div>
                </div>
                <div class="form-group">
                    <label>นามสกุล</label>
                    <input type="text" th:field="*{lastName}" />
                    <div class="form-hint error"
                         th:if="${#fields.hasErrors('lastName')}"
                         th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="form-group">
                <label>เบอร์โทรศัพท์</label>
                <input type="tel" th:field="*{phoneNo}" />
                <div class="form-hint error"
                     th:if="${#fields.hasErrors('phoneNo')}"
                     th:errors="*{phoneNo}"></div>
            </div>

        </div>

        <div class="section-card">

            <div class="section-header">
                <!-- Lucide: Home -->
                <div class="section-icon">
                    <i data-lucide="home"></i>
                </div>
                <div class="section-text">
                    <div class="section-title">ห้องพัก</div>
                    <div class="section-sub">พิมพ์เลขห้องหรือชื่อตึกเพื่อค้นหา</div>
                </div>
            </div>

            <div class="form-group">
                <label>ห้องพัก</label>

                <div class="room-combobox">
                    <input type="text"
                           id="roomSearch"
                           placeholder="พิมพ์เลขห้องหรือตึก..."
                           autocomplete="off" />

                    <div class="dropdown" id="roomDropdown">
                        <div th:each="room : ${rooms}"
                             class="dropdown-item room-option"
                             th:data-room-no="${room.roomNo}"
                             th:data-search="${room.roomNo + ' ' + room.building.buildingName}"
                             th:text="'ห้อง ' + ${room.roomNo} + ' (' + ${room.building.buildingName} + ')'">
                        </div>
                        <div class="dropdown-empty" id="roomEmpty" style="display:none;">
                            ไม่พบห้องที่ตรงกับคำค้นหา
                        </div>
                    </div>
                </div>

                <input type="hidden" id="roomNo" th:field="*{roomNo}" />

                <div class="form-hint error"
                     th:if="${#fields.hasErrors('roomNo')}"
                     th:errors="*{roomNo}"></div>
            </div>

        </div>

        <div class="form-actions">
            <a class="btn btn-outline" th:href="@{/admin/residents}">
                <i data-lucide="x" class="btn-icon"></i>
                ยกเลิก
            </a>
            <button type="submit" class="btn btn-approve">
                <i data-lucide="plus" class="btn-icon"></i>
                เพิ่มผู้พักอาศัย
            </button>
        </div>

    </form>

</main>

<!-- Lucide Icons Library -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script>
(function () {

    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }

    // ============================================
    // Room Combobox
    // ============================================
    const roomSearch   = document.getElementById('roomSearch');
    const roomDropdown = document.getElementById('roomDropdown');
    const roomNo       = document.getElementById('roomNo');
    const roomEmpty    = document.getElementById('roomEmpty');
    const roomOptions  = Array.from(document.querySelectorAll('.room-option'));

    function openDropdown() {
        roomDropdown.classList.add('open');
    }

    function closeDropdown() {
        roomDropdown.classList.remove('open');
    }

    function filterRooms() {
        const keyword = roomSearch.value.toLowerCase().trim();
        let found = 0;

        roomOptions.forEach(function (opt) {
            const match = opt.dataset.search.toLowerCase().includes(keyword);
            opt.style.display = match ? 'block' : 'none';
            if (match) found++;
        });

        roomEmpty.style.display = (found === 0 && keyword !== '') ? 'block' : 'none';
        openDropdown();
    }

    roomSearch.addEventListener('focus', filterRooms);
    roomSearch.addEventListener('input', function () {
        roomNo.value = '';
        filterRooms();
    });

    roomOptions.forEach(function (opt) {
        opt.addEventListener('click', function () {
            roomSearch.value = opt.textContent.trim();
            roomNo.value = opt.dataset.roomNo;
            closeDropdown();
        });
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.room-combobox')) closeDropdown();
    });
})();
</script>
</body>
</html>
